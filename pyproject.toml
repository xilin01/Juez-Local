[build-system]
requires = ['setuptools>=61']
build-backend = 'setuptools.build_meta'

[project]
name = 'juez'
version = '0.1.0'
description = 'Juez local para programación competitiva: veredictos, límites de tiempo y memoria, y pruebas de estrés.'
readme = 'README.md'
requires-python = '>=3.10'
license = {text = 'MIT'}

[project.optional-dependencies]
test = ['pytest']

[project.scripts]
juez = 'juez.cli:main'

[tool.setuptools]
packages = ['juez', 'juez.plataforma']

[tool.pytest.ini_options]
testpaths = ['tests']
